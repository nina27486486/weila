name: Windows CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test and build
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test with coverage
        run: flutter test --coverage --no-pub

      - name: Enforce coverage gates
        run: dart run tool/check_coverage.dart

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: weila-coverage
          path: coverage/lcov.info
          if-no-files-found: error

      - name: Build Windows release artifacts
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/package_windows_release.ps1

      - name: Smoke test Windows package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tool/test_windows_package.ps1

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weila-windows-x64
          path: |
            build/release/weila-*-windows-x64.zip
            build/release/weila-*-windows-x64-setup.exe
            build/release/SHA256SUMS.txt
          if-no-files-found: error
